name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cvats
          POSTGRES_PASSWORD: cvats_dev_password
          POSTGRES_DB: cv_ats_scanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvats -d cv_ats_scanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cvats:cvats_dev_password@localhost:5432/cv_ats_scanner
          SECRET_KEY: test-secret-key-for-ci-only-must-be-long-enough
          SYNC_TASKS: "true"
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        env:
          API_URL: http://localhost:8000
        run: npm run build
